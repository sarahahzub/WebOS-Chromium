<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Chromium 151's own fontconfig setup (FONTCONFIG_FILE, set by run.sh; mkipk.py ships it at the app root).
     The TV's /etc/fonts has no generic aliases, and 31-webos-aliases.conf appends "LG Display-Regular" to every
     pattern, so every family (sans, serif, monospace, the Views UI font) came out as LG Display with full hinting:
     the omnibox showed comma-like dots and uneven spacing. Names missing on the TV are skipped by fontconfig, so each
     list goes from best to safest. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias binding="strong"><family>sans-serif</family>
    <prefer><family>Droid Sans</family><family>LG Smart UI</family></prefer></alias>
  <alias binding="strong"><family>sans</family>
    <prefer><family>Droid Sans</family><family>LG Smart UI</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family>
    <prefer><family>Droid Sans</family><family>LG Smart UI</family></prefer></alias>
  <alias binding="strong"><family>serif</family>
    <prefer><family>Tinos</family><family>Droid Serif</family></prefer></alias>
  <alias binding="strong"><family>monospace</family>
    <prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer></alias>

  <!-- Common local font names the TV lacks, to look-alike faces it has. "prefer", not "accept": Chrome takes a
       substitute only if it is the first family after config substitution (or metric-compatible, as Tinos is for
       Times). With "accept" the requested name stayed first, Chrome refused Droid Sans for "Arial", and a page
       asking for Arial alone was drawn in the default serif. Web fonts (@font-face) never come through here. -->
  <alias binding="strong"><family>Times New Roman</family><prefer><family>Tinos</family><family>Droid Serif</family></prefer></alias>
  <alias binding="strong"><family>Times</family><prefer><family>Tinos</family><family>Droid Serif</family></prefer></alias>
  <alias binding="strong"><family>Georgia</family><prefer><family>Tinos</family><family>Droid Serif</family></prefer></alias>
  <alias binding="strong"><family>Cambria</family><prefer><family>Tinos</family><family>Droid Serif</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica Neue</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Verdana</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Tahoma</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Segoe UI</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Trebuchet MS</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Calibri</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Roboto</family><prefer><family>Droid Sans</family></prefer></alias>
  <alias binding="strong"><family>Courier New</family><prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Courier</family><prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Consolas</family><prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Monaco</family><prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Menlo</family><prefer><family>Droid Sans Mono</family></prefer></alias>
  <alias binding="strong"><family>Lucida Console</family><prefer><family>Droid Sans Mono</family></prefer></alias>

  <!-- Rendering: grayscale antialiasing (an OLED panel has no RGB stripe) and slight hinting, which keeps glyph
       shapes and spacing at the UI's 1.5 scale instead of snapping them to full pixels. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Chrome's Views UI (FallbackLinuxUi, no GTK) asks fontconfig with no family at all, so no alias above applies.
       Without this the first family is LG Display from LG's rules below. It also makes Droid Sans the fallback for
       any family the TV lacks, before LG Display. -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Droid Sans</string></edit>
  </match>

  <!-- LG's rules last: they append LG Display to every pattern, so it stays the final fallback. -->
  <include ignore_missing="yes">/etc/fonts/conf.d/31-webos-aliases.conf</include>

  <!-- The TV's font dir also holds bitmap .bin files for broadcast captions; keep them out. -->
  <selectfont><rejectfont><glob>*.bin</glob></rejectfont></selectfont>
</fontconfig>
